version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: book_inventory_postgres
    environment:
      POSTGRES_DB: crud_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2525
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - book_inventory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: book_inventory_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/crud_app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2525
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
    ports:
      - "8080:8080"
    networks:
      - book_inventory_network

networks:
  book_inventory_network:
    driver: bridge

volumes:
  postgres_data: